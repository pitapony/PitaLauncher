[package]
name = "pitagames-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Host platform detection for PitaGames: Proton discovery, GPU and env compilation"

[dependencies]
libc.workspace = true
pitagames-core.workspace = true
# `proton_update` reuses the shared release fetch/verify/unpack (ticket #12)
# instead of inventing a second download path.
pitagames-mods.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

# `power` speaks logind over D-Bus. Only Linux has logind, so `zbus` is built
# there alone; the trait seam and its fake keep the crate building and testing
# everywhere else.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
flate2.workspace = true
serde_json.workspace = true
tar.workspace = true
tempfile.workspace = true
