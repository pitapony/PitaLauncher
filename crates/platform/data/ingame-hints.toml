# Shipped in-game key hints, per injection mode (ticket #31).
#
# The game page tells a player which keys open the injected mod's own in-game
# menu. The keys are upstream's, they change between releases, and each injection
# mode has its own — so they are **data**, and this file is the one place to edit
# when a mod changes a keybinding.
#
# Every mode carries a `note` (the honest one-liner beside the list). A game's
# entry in the compatibility database may override that note with `[ingame] notes`
# in its TOML, so a title-specific caveat reads on that game's page without a code
# change.
#
# NOTE: not validated against the real mods yet. DLSSNR-AMD's keys are the plan §6
# item 6 set; Tier B and HelixSR ship the OptiScaler `Insert` menu they both use.
# A wrong key is a data edit.

[[modes]]
mode = "dlssnr"
note = "DLSSNR ships OptiScaler and its own NR Control menu; these are its keys."
hints = [
  { keys = "End", action = "NR Control menu" },
  { keys = "Insert", action = "OptiScaler menu (upscaler + frame gen)" },
  { keys = "F6", action = "Toggle neural rendering" },
  { keys = "F5", action = "Before / after screenshot" },
  { keys = "Ctrl+F11", action = "Cycle networks" },
]

[[modes]]
mode = "tier_b"
note = "Managed OptiScaler: the in-game menu owns the upscaler and frame generation."
hints = [
  { keys = "Insert", action = "OptiScaler menu (upscaler + frame gen)" },
]

[[modes]]
mode = "helixsr"
note = "HelixSR ships its own OptiScaler build; the menu picks HLX DLSS / HLX FSR 4."
hints = [
  { keys = "Insert", action = "HelixSR (OptiScaler) menu" },
]

[[modes]]
mode = "tier_a"
note = "Tier A is Proton's own env hooks — there is no in-game menu to open."
hints = []
