[package]
name = "pitagames-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Developer CLI for PitaGames (headless scans, diagnostics)"

[[bin]]
name = "pitagames-cli"
path = "src/main.rs"

[dependencies]
pitagames-core.workspace = true
pitagames-db.workspace = true
pitagames-metadata.workspace = true
pitagames-mods.workspace = true
pitagames-platform.workspace = true
pitagames-repair.workspace = true
pitagames-secrets.workspace = true
pitagames-stores.workspace = true

anyhow.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
zip.workspace = true
