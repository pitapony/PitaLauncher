[package]
name = "pitagames-stores"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Store backends and metadata parsers for PitaGames"

[dependencies]
libc.workspace = true
pitagames-core.workspace = true
notify.workspace = true
portable-pty.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true

# The Heroic/Lutris/Bottles importers (`import`). `rusqlite` is the same SQLite
# binding `pitagames-db` links through `sqlx` (both use `libsqlite3-sys` 0.30),
# and only ever opens another launcher's database read-only.
rusqlite = { version = "0.32", features = ["bundled"] }
serde_norway = "0.9"

[dev-dependencies]
tempfile.workspace = true
