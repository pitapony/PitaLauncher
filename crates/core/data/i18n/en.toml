# The `en` catalog — the only source of user-facing strings.
#
# One flat table of `"key" = "string"`. Keys are dotted by area
# (`library.title`, `action.play`) and quoted so TOML reads them literally
# rather than as nested tables. A value may hold a `{placeholder}` the caller
# substitutes with `str::replace`, since `format!` needs a literal format
# string. Adding a language is a data change: a new file with this exact key
# set, wired through `Language::source`.
#
# The test in `crates/core/src/i18n.rs` scans the app sources and fails when a
# `t("…")` key is missing here or an entry here is unused.

