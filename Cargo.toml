[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/db",
    "crates/art",
    "crates/stores",
    "crates/metadata",
    "crates/platform",
    "crates/secrets",
    "crates/shim",
    "crates/cli",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
pitagames-core = { path = "crates/core" }
pitagames-db = { path = "crates/db" }
pitagames-art = { path = "crates/art" }
pitagames-stores = { path = "crates/stores" }
pitagames-metadata = { path = "crates/metadata" }
pitagames-platform = { path = "crates/platform" }
pitagames-secrets = { path = "crates/secrets" }

anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
notify = "8"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }

dioxus = { version = "0.7", features = ["desktop"] }
futures-channel = "0.3"
futures-util = "0.3"

tempfile = "3.15"
