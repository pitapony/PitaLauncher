[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/db",
    "crates/art",
    "crates/stores",
    "crates/metadata",
    "crates/platform",
    "crates/mods",
    "crates/secrets",
    "crates/input",
    "crates/shim",
    "crates/cli",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.89 for `std::fs::File::try_lock` (the single-instance lock); keyring 4 set
# the old 1.88 floor and edition 2024 gives let-chains.
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
pitagames-core = { path = "crates/core" }
pitagames-db = { path = "crates/db" }
pitagames-art = { path = "crates/art" }
pitagames-stores = { path = "crates/stores" }
pitagames-metadata = { path = "crates/metadata" }
pitagames-platform = { path = "crates/platform" }
pitagames-mods = { path = "crates/mods" }
pitagames-secrets = { path = "crates/secrets" }
pitagames-input = { path = "crates/input" }

anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
# `blake3` is the per-file / tree hash the mod manifest records; `sha2` stays
# for release and Steam-config digests, which are SHA-256 by contract.
blake3 = "1"
walkdir = "2"
# Mod release fetching (ticket #12): a pinned release archive arrives as a zip
# or as a zstd-/gzip-/plain-tar, so unpacking needs all four. `flate2` provides
# the gzip reader a GE-Proton `.tar.gz` needs (ticket #34) and the deflate reader
# `zip` uses; both take its pure-Rust zlib-rs backend — these packages are
# read-only here, never written.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.14"
# 0.11 is the version whose SDL-derived mappings and evdev/udev backend the
# console input slice was designed around; the launcher never uses the webview's
# `navigator.getGamepads()` instead. Its default `wgi` feature is Windows-only
# and inert on the target.
gilrs = "0.11"
libc = "0.2"
notify = "8"
portable-pty = "0.8"
rand = "0.8"
regex = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }

dioxus = { version = "0.7", features = ["desktop"] }
futures-channel = "0.3"
futures-util = "0.3"

# Golden-file snapshots for the M3 env compiler (`platform::envc`, ticket #18).
# No inline snapshots: the matrix is committed as files under `tests/snapshots`.
insta = "1"

# `goblin` reads a game's PE header so the neural-rendering backends can refuse a
# 32-bit game (ticket #28); only the PE half is enabled.
goblin = { version = "0.10", default-features = false, features = ["std", "pe32", "pe64"] }

tempfile = "3.15"
